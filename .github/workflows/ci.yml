name: CI

on:
  pull_request:
    branches: [ "main" ]
  push:
    branches: [ "main" ]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install ruff
        run: python -m pip install ruff

      - name: Ruff check
        run: ruff check .

      - name: Ruff format check
        run: ruff format --check .

  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      matrix:
        python-version: ["3.13", "3.14"]

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov ruff pip-audit "diff-cover==11.0.4"

      - name: Dependency vulnerability gate (pip-audit)
        if: matrix.python-version == '3.13'
        run: pip-audit -r requirements.txt --strict

      - name: Run tests with coverage gate
        env:
          BOTEX_DISABLE_DOTENV: "1"
          PYTHONPATH: "."
        # Ratchet: 75 after the partitioning merge (clean-main baseline was
        # 78.52% at 73); target is 85 via closing analytics/coverage gaps.
        run: >
          python -m pytest tests/
          --cov=botex
          --cov-report=term-missing:skip-covered
          --cov-report=xml:coverage.xml
          --cov-fail-under=75
          -q

      - name: PR diff coverage check (diff-cover)
        if: github.event_name == 'pull_request' && matrix.python-version == '3.13'
        continue-on-error: true
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          set +e
          diff-cover coverage.xml --compare-branch="origin/${BASE_REF}" --fail-under=80 --markdown-report diff-cover.md
          rc=$?
          set -e
          if [ -s diff-cover.md ]; then
            {
              echo "## Diff Coverage (PR lines, target 80%)"
              cat diff-cover.md
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          exit "$rc"

  web:
    name: PWA build (vue-tsc + vite)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: web/package-lock.json

      - name: Install web dependencies
        working-directory: web
        run: npm ci

      - name: Audit web dependencies
        working-directory: web
        run: npm audit --audit-level=high --omit=dev

      - name: Build PWA (type check + bundle)
        working-directory: web
        run: npm run build

  pr-review:
    name: PR Review (Skylos done + change map)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      # Pinned CLI-only install (no Skylos Cloud upload, no --danger SAST due to
      # false positives on dict.get() / alias grafts). Expand flags selectively
      # once upstream matures.
      - name: Install Skylos (pinned)
        run: python -m pip install --no-cache-dir "skylos==5.6.0"

      - name: Run Skylos anti-regression & change map
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          set +e
          skylos done --base "origin/${BASE_REF}" --no-tests --map --format markdown > skylos-report.md
          rc=$?
          set -e
          if [ -s skylos-report.md ]; then
            cat skylos-report.md >> "$GITHUB_STEP_SUMMARY"
            cat skylos-report.md
          fi
          # --no-tests intentionally exits 1 (UNFINISHED) because pytest runs in the `test` job.
          if [ "$rc" -gt 1 ]; then
            exit "$rc"
          fi

  workflow-audit:
    name: Workflow Security Audit (zizmor)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    continue-on-error: true
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install zizmor (pinned)
        run: python -m pip install --no-cache-dir "zizmor==1.32.0"

      # Advisory mode (--no-exit-codes): surfaces workflow findings in the step
      # summary without failing PRs on pre-existing unpinned actions / cache
      # findings. Drop --no-exit-codes once existing findings are triaged.
      - name: Audit GitHub Actions workflows
        run: |
          zizmor --offline --no-progress --no-exit-codes --format plain .github/workflows > zizmor-report.txt
          {
            echo "## Zizmor Workflow Audit"
            echo '```text'
            cat zizmor-report.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          cat zizmor-report.txt
