name: CI

on:
  pull_request:
    branches: [ "main" ]
  push:
    branches: [ "main" ]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install ruff
        run: python -m pip install ruff

      - name: Ruff check
        run: ruff check .

      - name: Ruff format check
        run: ruff format --check .

      - name: Repo map freshness check
        run: python scripts/gen_repo_map.py --check

  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      matrix:
        python-version: ["3.13", "3.14"]

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov ruff pip-audit "diff-cover==11.0.4"

      - name: Dependency vulnerability gate (pip-audit)
        if: matrix.python-version == '3.13'
        run: pip-audit -r requirements.txt --strict

      - name: Run tests with coverage gate
        env:
          BOTEX_DISABLE_DOTENV: "1"
          PYTHONPATH: "."
        # Ratchet: 75 after the partitioning merge (clean-main baseline was
        # 78.52% at 73); target is 85 via closing analytics/coverage gaps.
        run: >
          python -m pytest tests/
          --cov=botex
          --cov-report=term-missing:skip-covered
          --cov-report=xml:coverage.xml
          --cov-fail-under=75
          -q

      - name: PR diff coverage check (diff-cover)
        if: github.event_name == 'pull_request' && matrix.python-version == '3.13'
        continue-on-error: true
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          set +e
          diff-cover coverage.xml --compare-branch="origin/${BASE_REF}" --fail-under=80 --markdown-report diff-cover.md
          rc=$?
          set -e
          if [ -s diff-cover.md ]; then
            {
              echo "## Diff Coverage (PR lines, target 80%)"
              cat diff-cover.md
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          exit "$rc"

  web:
    name: PWA build (vue-tsc + vite)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: web/package-lock.json

      - name: Install web dependencies
        working-directory: web
        run: npm ci

      - name: Audit web dependencies
        working-directory: web
        run: npm audit --audit-level=high --omit=dev

      - name: Build PWA (type check + bundle)
        working-directory: web
        run: npm run build

  pr-review:
    name: PR Review (Skylos done + change map)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      # Pinned CLI-only install (no Skylos Cloud upload, no --danger SAST due to
      # false positives on dict.get() / alias grafts). Expand flags selectively
      # once upstream matures.
      - name: Install Skylos (pinned)
        run: python -m pip install --no-cache-dir "skylos==5.6.0"

      - name: Run Skylos anti-regression & change map
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          set +e
          skylos done --base "origin/${BASE_REF}" --no-tests --map --format markdown > skylos-report.md
          rc=$?
          set -e
          if [ -s skylos-report.md ]; then
            cat skylos-report.md >> "$GITHUB_STEP_SUMMARY"
            cat skylos-report.md
          fi
          # --no-tests intentionally exits 1 (UNFINISHED) because pytest runs in the `test` job.
          if [ "$rc" -gt 1 ]; then
            exit "$rc"
          fi

  edge-smoke:
    name: Edge daemon smoke (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    env:
      BOTEX_DISABLE_DOTENV: "1"
      PYTHONPATH: "."
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Focused edge test matrix
        run: >
          python -m pytest
          tests/test_edge_runner.py
          tests/test_edge_qos_daemon.py
          tests/test_edge_cli_daemon.py
          tests/test_edge_workspaces.py
          tests/test_edge_credentials.py
          tests/test_edge_argv_dispatch.py
          tests/test_host_os_driver.py
          -q

      # Zero-network smoke: isolated BOTEX_SWARM_HOME, no Cloud endpoint; an
      # offline-enrolled workspace lets the host daemon boot its loopback lane,
      # publish the health state file, answer a token-authenticated /status
      # probe, then drain cleanly on SIGTERM (Linux requires exit code 0).
      - name: Zero-network daemon health & shutdown smoke
        shell: bash
        run: |
          export BOTEX_SWARM_HOME="$RUNNER_TEMP/botex-swarm-home"
          export BOTEX_CREDENTIALS_DIR="$RUNNER_TEMP/botex-creds"
          export BOTEX_WORKSPACES_FILE="$RUNNER_TEMP/botex-swarm-home/host_workspaces.json"
          mkdir -p "$BOTEX_SWARM_HOME" "$BOTEX_CREDENTIALS_DIR"
          python - << 'PYEOF'
          import json, os, shutil, signal, subprocess, sys, tempfile, time, urllib.request

          py = [sys.executable, "server.py"]

          def run(*args):
              subprocess.run(py + list(args), check=True, timeout=60)

          smoke_ws = tempfile.mkdtemp(prefix="smoke-ws-")
          try:
              tok_file = os.path.join(smoke_ws, "token.txt")
              with open(tok_file, "w", encoding="utf-8") as fh:
                  fh.write("btxd_smoke0000000000000000.smokeSecret0000000000\n")
              run("edge", "enroll", "--device-id", "smoke-dev",
                  "--workspace-id", "smoke-ws",
                  "--workspace", smoke_ws, "--token-file", tok_file)
              run("edge", "workspaces", "add", smoke_ws)

              proc = subprocess.Popen(
                  py + ["edge", "--edge-daemon",
                        "--server", "wss://smoke.invalid/api/edge/ws",
                        "--loopback-port", "0"],
              )
              state_file = os.path.join(
                  os.environ["BOTEX_SWARM_HOME"], "edge_daemon.json")
              deadline = time.monotonic() + 30
              healthy = False
              health_url = ""
              while time.monotonic() < deadline:
                  if proc.poll() is not None:
                      break
                  if os.path.exists(state_file):
                      try:
                          with open(state_file, encoding="utf-8") as fh:
                              state = json.load(fh)
                          port = int(state.get("port") or 0)
                          loop_tok = str(state.get("loopback_token") or "")
                          if port > 0 and loop_tok:
                              # /status is the daemon's health endpoint; the
                              # probe data comes from edge_daemon.json.
                              health_url = f"http://127.0.0.1:{port}/status"
                              req = urllib.request.Request(health_url)
                              req.add_header("X-Loopback-Token", loop_tok)
                              req.add_header("Host", f"127.0.0.1:{port}")
                              with urllib.request.urlopen(req, timeout=3) as resp:
                                  body = json.loads(resp.read().decode("utf-8"))
                                  healthy = (
                                      resp.status == 200
                                      and bool(body.get("ok"))
                                      and body.get("status") == "running"
                                  )
                          if healthy:
                              break
                      except (OSError, ValueError):
                          pass
                  time.sleep(0.3)
              if os.name == "nt":
                  proc.terminate()
              else:
                  proc.send_signal(signal.SIGTERM)
              try:
                  rc = proc.wait(timeout=20)
              except subprocess.TimeoutExpired:
                  proc.kill()
                  proc.wait(timeout=10)
                  rc = 1
              print(f"smoke: healthy={healthy} exit={rc} health_url={health_url}")
              if not healthy:
                  raise SystemExit(1)
              if os.name != "nt" and rc != 0:
                  raise SystemExit(f"daemon exited {rc} after SIGTERM (expected 0)")
          finally:
              shutil.rmtree(smoke_ws, ignore_errors=True)
          PYEOF

  workflow-audit:
    name: Workflow Security Audit (zizmor)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    continue-on-error: true
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install zizmor (pinned)
        run: python -m pip install --no-cache-dir "zizmor==1.32.0"

      # Advisory mode (--no-exit-codes): surfaces workflow findings in the step
      # summary without failing PRs on pre-existing unpinned actions / cache
      # findings. Drop --no-exit-codes once existing findings are triaged.
      - name: Audit GitHub Actions workflows
        run: |
          zizmor --offline --no-progress --no-exit-codes --format plain .github/workflows > zizmor-report.txt
          {
            echo "## Zizmor Workflow Audit"
            echo '```text'
            cat zizmor-report.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          cat zizmor-report.txt
