name: Create Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. v2.1.0)'
        required: true
        type: string

permissions:
  contents: read

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: release
    permissions:
      contents: write
      id-token: write

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.13"
        cache: 'pip'

    - name: Version parity check
      run: |
        INPUT_VER="${{ github.event.inputs.version }}"
        CLEAN="${INPUT_VER#v}"
        PYPROJECT_VER=$(grep -Po '(?m)^version = "\K[^"]+' pyproject.toml)
        PKG_VER=$(grep -Po '__version__ = "\K[^"]+' botex/__init__.py)
        echo "input=${CLEAN} pyproject=${PYPROJECT_VER} package=${PKG_VER}"
        if [ "${CLEAN}" != "${PYPROJECT_VER}" ] || [ "${PYPROJECT_VER}" != "${PKG_VER}" ]; then
          echo "::error::Version mismatch: input '${CLEAN}' vs pyproject '${PYPROJECT_VER}' vs botex.__version__ '${PKG_VER}'"
          exit 1
        fi

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest ruff

    - name: Lint with ruff
      run: |
        ruff check .
        ruff format --check .

    - name: Run tests with pytest
      env:
        BOTEX_DISABLE_DOTENV: "1"
        PYTHONPATH: "."
      run: python -m pytest tests/ -q

    - name: Set up Node.js for PWA build
      uses: actions/setup-node@v4
      if: hashFiles('web/package.json') != ''
      with:
        node-version: 20
        cache: "npm"
        cache-dependency-path: web/package-lock.json

    - name: Build web assets
      working-directory: web
      if: hashFiles('web/package.json') != ''
      run: |
        npm ci
        npm run build

    - name: Create release zip archive
      run: |
        mkdir -p botex-release
        # Product artifact only: no tests/ (packaging hygiene — the suite
        # has already gated this build two steps above).
        cp -r botex bin docs skills server.py pyproject.toml requirements.txt README.md ROADMAP.md AGENTS.md LICENSE NOTICE glama.json botex-release/
        # Sanitized default config — never ship a maintainer-specific
        # botex.config.json (local paths, machine-specific settings).
        cp botex.config.example.json botex-release/botex.config.json
        if [ -d web/dist ]; then
          mkdir -p botex-release/web
          cp -r web/dist botex-release/web/
        fi
        cd botex-release
        zip -r ../botex-${{ github.event.inputs.version }}.zip .
        cd ..

    - name: Attest release artifact provenance
      uses: actions/attest-build-provenance@v2
      with:
        subject-path: botex-${{ github.event.inputs.version }}.zip

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ github.event.inputs.version }}
        name: Release ${{ github.event.inputs.version }}
        files: botex-${{ github.event.inputs.version }}.zip
        generate_release_notes: true
