<!DOCTYPE html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content" />
    <title>BoteX Control</title>
    <meta name="description" content="Progressive Web App Command Center for BoteX Cloud & Harness" />
    <meta name="theme-color" content="#0f172a" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="BoteX Control" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script>
      (function() {
        try {
          var skin = localStorage.getItem('botex_skin');
          if (!skin) {
            var legacy = localStorage.getItem('botex_theme');
            skin = legacy === 'light' ? 'studio-light' : 'cyber-slate';
          }
          document.documentElement.setAttribute('data-skin', skin);
          var themeMeta = document.querySelector('meta[name="theme-color"]');
          if (themeMeta) {
            themeMeta.setAttribute('content', skin === 'studio-light' ? '#f8fafc' : '#0f172a');
          }
          if (skin === 'studio-light') {
            document.documentElement.classList.remove('dark');
            document.documentElement.classList.add('light');
          } else {
            document.documentElement.classList.remove('light');
            document.documentElement.classList.add('dark');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-botex-950 text-slate-100 font-sans antialiased selection:bg-brand-blue/30 selection:text-white min-h-dvh">
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
