[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "botex-harness"
version = "2.1.0"
description = "Agent-agnostic MCP harness for autonomous code-editing subagents"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Jakub Grzesiak" }]
keywords = ["mcp", "agent", "code-editing", "openrouter", "subagent"]
requires-python = ">=3.10,<3.14"
dependencies = [
    "openai>=1.40",
    "python-dotenv>=1.0",
    "mcp>=2.0",
    "typing_extensions>=4.0",
    "fastapi>=0.100",
    "uvicorn>=0.20",
    "websockets>=12.0",
    "sse-starlette>=2.0",
]

[project.optional-dependencies]
cli = ["rich>=13.0"]
dev = ["ruff>=0.1.0", "pytest>=7.0"]

[tool.ruff]
line-length = 100
target-version = "py310"
exclude = [
    "typing_extensions.py",
    ".snapshots",
    ".botex",
    ".agents",
    "build",
    "dist",
]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501", "E402", "E741", "E711", "E712", "E701"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["F841", "I001", "F401"]

[project.scripts]
botex = "server:main"

[tool.setuptools]
py-modules = ["server"]
packages = ["botex"]
