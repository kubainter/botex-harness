[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "botex-harness"
version = "1.0.0"
description = "Agent-agnostic MCP harness for autonomous code-editing subagents"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Jakub Grzesiak" }]
keywords = ["mcp", "agent", "code-editing", "openrouter", "subagent"]
requires-python = ">=3.10"
dependencies = [
    "openai>=1.40",
    "python-dotenv>=1.0",
    "mcp>=2.0",
    "typing_extensions>=4.0",
]

[project.optional-dependencies]
cli = ["rich>=13.0"]

[project.scripts]
botex = "server:main"

[tool.setuptools]
py-modules = ["server"]
packages = ["botex"]
